name: iOS source build preflight
on:
  push:
    branches: [codex/ios-build-preflight-20260907]
    paths:
      - apps/mobile_flutter/**
      - .github/workflows/ios-build-preflight.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Record toolchain
        run: |
          flutter --version
          xcodebuild -version
          pod --version
      - name: Resolve Flutter dependencies
        working-directory: apps/mobile_flutter
        run: flutter pub get
      - name: Test push integration
        working-directory: apps/mobile_flutter
        run: flutter test test/features/push
      - name: Build unsigned iOS device app
        working-directory: apps/mobile_flutter
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign --dart-define=LIUHETONG_IN_APP_UPDATE=false --dart-define=LIUHETONG_SYGNAL_URL=https://liuhetong888.com 2>&1 | tee "$RUNNER_TEMP/ios-build.log"
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-preflight-diagnostics
          path: ${{ runner.temp }}/ios-build.log
          if-no-files-found: ignore
          retention-days: 7
