name: iOS TestFlight
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/mobile_flutter/**"
      - ".github/workflows/ios-testflight.yml"
  push:
    tags: ["v*.*.*"]
# 连续 dispatch 时取消旧 run，避免排队叠加出几十分钟的僵尸任务。
concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # analyze/test 统一在 ubuntu 执行：macOS runner 只有 2 核，全量套件约 45 分钟
  # 且存在平台差异失败；ubuntu 约 8 分钟。macOS job 只负责真实 iOS 构建。
  flutter-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true
      - name: Flutter checks
        working-directory: apps/mobile_flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test

  simulator-build:
    needs: flutter-checks
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true
      # 与 build-unsigned-ipa 相同：默认 Xcode 过旧，无法编译 Firebase 12 的 Swift 6 语法。
      - name: Select newest Xcode (Firebase 12 needs Swift 6)
        run: |
          ls -d /Applications/Xcode*.app | sort -V
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version
      # firebase_messaging 插件拷贝需要 build/ios/SourcePackages 父目录已存在；
      # SPM 集成必须保持关闭（firebase_messaging SPM 工具需要更新版 Xcode）。
      - name: Prepare iOS dependency directories
        working-directory: apps/mobile_flutter
        run: |
          flutter config --no-enable-swift-package-manager
          mkdir -p build/ios/SourcePackages
      # mobile_scanner 6.0.11 的 MLKit 二进制没有 arm64 模拟器切片，模拟器构建必然
      # 失败；与 compat 工作流一致地临时摘除（扫描能力由真机构建覆盖）。
      - name: Exclude mobile_scanner for simulator build
        working-directory: apps/mobile_flutter
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('pubspec.yaml')
          content = p.read_text()
          assert content.count('  mobile_scanner: 6.0.11\n') == 1
          p.write_text(content.replace('  mobile_scanner: 6.0.11\n', ''))
          PY
          echo 'Simulator-build exclusion: mobile_scanner 6.0.11 (MLKit lacks arm64 simulator slice); scanning is covered by device builds.'
      - name: Flutter pub get
        working-directory: apps/mobile_flutter
        run: flutter pub get
      - name: Build iOS simulator app
        working-directory: apps/mobile_flutter
        run: flutter build ios --simulator --no-codesign

  # BUG 交付（企业签名流程）：产出未签名 IPA 供外部企业证书重签。
  # 不需要任何 Apple secrets；使用 --no-codesign，打包 Payload/<app> 为 IPA。
  build-unsigned-ipa:
    if: github.event_name == 'workflow_dispatch'
    needs: flutter-checks
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true
      - name: Select newest Xcode (Firebase 12 needs Swift 6)
        run: |
          ls -d /Applications/Xcode*.app | sort -V
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version
      - name: Disable Flutter SPM (firebase_messaging SPM tools need newer Xcode)
        run: flutter config --no-enable-swift-package-manager
      - name: Prepare iOS package directories
        working-directory: apps/mobile_flutter
        run: mkdir -p build/ios/SourcePackages
      - name: Flutter pub get
        working-directory: apps/mobile_flutter
        run: flutter pub get
      - name: Build unsigned iOS app (device, release)
        working-directory: apps/mobile_flutter
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        working-directory: apps/mobile_flutter
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qry liuhetong_mobile_unsigned.ipa Payload
          mkdir -p build/ios/iphoneos
          cp liuhetong_mobile_unsigned.ipa build/ios/iphoneos/
          shasum -a 256 liuhetong_mobile_unsigned.ipa
      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: liuhetong-mobile-unsigned-ipa
          path: apps/mobile_flutter/liuhetong_mobile_unsigned.ipa
          if-no-files-found: error

  build-upload:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: flutter-checks
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true
      # 与 build-unsigned-ipa 相同：默认 Xcode 过旧，无法编译 Firebase 12 的 Swift 6 语法。
      - name: Select newest Xcode (Firebase 12 needs Swift 6)
        run: |
          ls -d /Applications/Xcode*.app | sort -V
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version
      - name: Generate iOS project
        working-directory: apps/mobile_flutter
        run: flutter create --platforms=ios --project-name=liuhetong_mobile .
      # flutter create 之后 pub get 会拷贝 firebase_messaging 插件；
      # 与 simulator-build 相同：预建 SourcePackages 并保持 SPM 关闭。
      - name: Prepare iOS dependency directories
        working-directory: apps/mobile_flutter
        run: |
          flutter config --no-enable-swift-package-manager
          mkdir -p build/ios/SourcePackages
      - name: Flutter pub get
        working-directory: apps/mobile_flutter
        run: flutter pub get
      - name: Install signing assets
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          security create-keychain -p "$RUNNER_TEMP" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$RUNNER_TEMP" build.keychain
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # 不设置 partition list 时 codesign 会在 CI 里静默挂起（等待无法出现的授权 UI）。
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$RUNNER_TEMP" build.keychain
          security list-keychains -d user -s build.keychain "$HOME/Library/Keychains/login.keychain-db"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/liuhetong.mobileprovision"
      - name: Generate export options and build IPA
        working-directory: apps/mobile_flutter
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          test -n "$APPLE_TEAM_ID" && test -n "$IOS_BUNDLE_ID" && test -n "$IOS_PROVISIONING_PROFILE_NAME"
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*/PRODUCT_BUNDLE_IDENTIFIER = $IOS_BUNDLE_ID/g" ios/Runner.xcodeproj/project.pbxproj
          sed -i '' "s/DEVELOPMENT_TEAM = [^;]*/DEVELOPMENT_TEAM = $APPLE_TEAM_ID/g" ios/Runner.xcodeproj/project.pbxproj
          export DEVELOPMENT_TEAM=$APPLE_TEAM_ID
          export PRODUCT_BUNDLE_IDENTIFIER=$IOS_BUNDLE_ID
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>$IOS_BUNDLE_ID</key><string>$IOS_PROVISIONING_PROFILE_NAME</string>
            </dict>
          </dict></plist>
          EOF
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
      - name: Upload TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: apps/mobile_flutter/build/ios/ipa/liuhetong_mobile.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
