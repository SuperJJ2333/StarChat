name: Release metadata gates (no APK or IPA download)
on:
  pull_request:
    paths:
      - 'scripts/release_metadata.py'
      - 'scripts/release*.ps1'
      - 'tests/mobile/test_release_metadata.py'
      - '.github/workflows/release-metadata.yml'
  workflow_dispatch:
    inputs:
      release_record:
        description: 'Release JSON: platform/version/build/artifact_url/artifact_bytes/signing_confirmed_by/bundle_id (iOS)'
        required: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.5
      - run: python -m pytest tests/mobile/test_release_metadata.py -q
      - name: Verify published metadata (read only, HEAD for binary)
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_RECORD: ${{ inputs.release_record }}
        run: |
          mkdir -p docs/verification/artifacts/ci-release-metadata
          python -c 'import os,pathlib; pathlib.Path("docs/verification/artifacts/ci-release-metadata/release.json").write_text(os.environ["RELEASE_RECORD"],encoding="utf-8")'
          python scripts/release_metadata.py check docs/verification/artifacts/ci-release-metadata/release.json
