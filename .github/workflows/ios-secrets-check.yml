name: iOS Apple secrets verification
on:
  push:
    branches: [codex/ios-secrets-check-20260907-151818]
    paths: [.github/workflows/ios-secrets-check.yml]
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Validate configuration and read Apple app record
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        shell: bash
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          async function main() {
            const names = ['APPLE_TEAM_ID','IOS_BUNDLE_ID','APPSTORE_ISSUER_ID','APPSTORE_KEY_ID','APPSTORE_PRIVATE_KEY'];
            for (const name of names) {
              if (!process.env[name]) throw new Error(`${name}: MISSING`);
            }
            if (process.env.APPLE_TEAM_ID !== 'HY9Q7Q35S5') throw new Error('APPLE_TEAM_ID: EXPECTED_VALUE_MISMATCH');
            console.log('APPLE_TEAM_ID: EXPECTED_VALUE_PASS');
            if (process.env.IOS_BUNDLE_ID !== 'com.liuhetong.liuhetongMobile') throw new Error('IOS_BUNDLE_ID: EXPECTED_VALUE_MISMATCH');
            console.log('IOS_BUNDLE_ID: EXPECTED_VALUE_PASS');
            if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(process.env.APPSTORE_ISSUER_ID)) throw new Error('APPSTORE_ISSUER_ID: INVALID_FORMAT');
            if (!/^[A-Z0-9]{10}$/.test(process.env.APPSTORE_KEY_ID)) throw new Error('APPSTORE_KEY_ID: INVALID_FORMAT');
            let key;
            try { key = crypto.createPrivateKey(process.env.APPSTORE_PRIVATE_KEY); }
            catch { throw new Error('APPSTORE_PRIVATE_KEY: INVALID_PEM'); }
            if (key.asymmetricKeyType !== 'ec' || key.asymmetricKeyDetails.namedCurve !== 'prime256v1') throw new Error('APPSTORE_PRIVATE_KEY: EXPECTED_EC_P256');
            console.log('APPSTORE_PRIVATE_KEY: PEM_EC_P256_PASS');
            const encode = x => Buffer.from(JSON.stringify(x)).toString('base64url');
            const now = Math.floor(Date.now()/1000);
            const input = encode({alg:'ES256',kid:process.env.APPSTORE_KEY_ID,typ:'JWT'}) + '.' + encode({iss:process.env.APPSTORE_ISSUER_ID,iat:now-10,exp:now+120,aud:'appstoreconnect-v1'});
            const signature = crypto.sign('sha256',Buffer.from(input),{key,dsaEncoding:'ieee-p1363'}).toString('base64url');
            const token = input+'.'+signature;
            console.log('::add-mask::'+token);
            let response;
            try {
              response = await fetch('https://api.appstoreconnect.apple.com/v1/apps?filter%5BbundleId%5D=com.liuhetong.liuhetongMobile&fields%5Bapps%5D=bundleId&limit=2', {
                headers:{Authorization:'Bearer '+token}, redirect:'error', signal:AbortSignal.timeout(30000)
              });
            } catch { throw new Error('APPLE_API: NETWORK_ERROR'); }
            if (response.status !== 200) throw new Error('APPLE_API: HTTP_'+response.status);
            console.log('APPLE_API: AUTHENTICATION_PASS_HTTP_200');
            let body;
            try { body = await response.json(); } catch { throw new Error('APPLE_API: INVALID_JSON'); }
            if (!Array.isArray(body.data) || body.data.length !== 1 || body.data[0].attributes?.bundleId !== 'com.liuhetong.liuhetongMobile') throw new Error('APPLE_APP: BUNDLE_NOT_FOUND_OR_AMBIGUOUS');
            console.log('APPLE_APP: BUNDLE_FOUND_PASS');
            console.log('RESULT: ALL_FIVE_SECRETS_VALIDATED_FOR_APP_LOOKUP');
            console.log('SCOPE: No certificate, provisioning profile, APNs, IPA or upload validation performed. Team ID matched expected configuration only.');
          }
          main().catch(error => {
            const message = error.message;
            console.log(/^[A-Z_]+: [A-Z0-9_]+$/.test(message) ? message : 'VALIDATION: UNEXPECTED_FAILURE');
            process.exitCode = 1;
          });
          NODE
  signing:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Verify Apple signing assets in macOS keychain
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        shell: bash
        run: |
          python3 <<'PY'
          import base64, datetime, hashlib, os, pathlib, plistlib, re, secrets, ssl, subprocess, sys
          folder = pathlib.Path(os.environ['RUNNER_TEMP']) / 'chatflow-signing-check'
          folder.mkdir(mode=0o700)
          keychain = folder / 'validation.keychain-db'
          def check(ok, label):
              if not ok: raise ValueError(label)
          def run(label, *args):
              result = subprocess.run(args, capture_output=True)
              if result.returncode: raise ValueError(label)
              return result.stdout
          try:
              for name in ['IOS_CERTIFICATE_BASE64','IOS_CERTIFICATE_PASSWORD','IOS_PROFILE_BASE64','IOS_PROVISIONING_PROFILE_NAME']:
                  check(bool(os.environ.get(name)), name+'_MISSING')
              p12 = folder / 'certificate.p12'
              profile_file = folder / 'profile.mobileprovision'
              p12.write_bytes(base64.b64decode(os.environ['IOS_CERTIFICATE_BASE64'], validate=True))
              profile_file.write_bytes(base64.b64decode(os.environ['IOS_PROFILE_BASE64'], validate=True))
              p12.chmod(0o600)
              profile_file.chmod(0o600)
              certificate_pem = run('P12_DECODE_FAILED', 'openssl','pkcs12','-in',str(p12),'-passin','env:IOS_CERTIFICATE_PASSWORD','-clcerts','-nokeys')
              match = re.search(rb'-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----', certificate_pem, re.S)
              check(match is not None, 'P12_CERTIFICATE_MISSING')
              der = ssl.PEM_cert_to_DER_cert(match.group().decode('ascii'))
              check(hashlib.sha256(der).hexdigest() == 'd354ebdd20426c83a4e6f960586bbb981d9889278c63326ec67fbf10978cfeeb', 'P12_CERTIFICATE_MISMATCH')
              profile = plistlib.loads(run('PROFILE_DECODE_FAILED','security','cms','-D','-i',str(profile_file)))
              ent = profile['Entitlements']
              check(profile['TeamIdentifier'] == ['HY9Q7Q35S5'], 'PROFILE_TEAM_MISMATCH')
              check(ent.get('application-identifier') == 'HY9Q7Q35S5.com.liuhetong.liuhetongMobile', 'PROFILE_APP_MISMATCH')
              check(profile['Name'] == os.environ['IOS_PROVISIONING_PROFILE_NAME'] == 'ChatFlow_AppStore', 'PROFILE_NAME_MISMATCH')
              check(ent.get('aps-environment') == 'production', 'PROFILE_APNS_MISMATCH')
              check(ent.get('get-task-allow') is False and 'ProvisionedDevices' not in profile and not profile.get('ProvisionsAllDevices'), 'PROFILE_TYPE_MISMATCH')
              check(der in profile['DeveloperCertificates'], 'PROFILE_CERTIFICATE_MISMATCH')
              check(profile['ExpirationDate'].replace(tzinfo=datetime.timezone.utc) > datetime.datetime.now(datetime.timezone.utc), 'PROFILE_EXPIRED')
              print('PROFILE_APP_STORE_PRODUCTION_APNS_PASS')
              keychain_password = secrets.token_urlsafe(40)
              run('KEYCHAIN_CREATE_FAILED','security','create-keychain','-p',keychain_password,str(keychain))
              run('KEYCHAIN_UNLOCK_FAILED','security','unlock-keychain','-p',keychain_password,str(keychain))
              run('P12_KEYCHAIN_IMPORT_FAILED','security','import',str(p12),'-k',str(keychain),'-P',os.environ['IOS_CERTIFICATE_PASSWORD'],'-T','/usr/bin/codesign')
              run('KEY_PARTITION_SETUP_FAILED','security','set-key-partition-list','-S','apple-tool:,apple:,codesign:','-s','-k',keychain_password,str(keychain))
              identity = hashlib.sha1(der).hexdigest().upper()
              identities = run('SIGNING_IDENTITY_QUERY_FAILED','security','find-identity','-v','-p','codesigning',str(keychain)).decode('utf-8')
              check(identity in identities, 'VALID_SIGNING_IDENTITY_NOT_FOUND')
              print('MACOS_P12_IMPORT_AND_VALID_SIGNING_IDENTITY_PASS')
              print('RESULT: SIGNING_ASSETS_VALIDATED_NO_APP_BUILD_OR_UPLOAD')
          except Exception as error:
              label = str(error)
              print(label if re.fullmatch('[A-Z0-9_]+', label) else 'SIGNING_VALIDATION_UNEXPECTED_FAILURE')
              sys.exit(1)
          finally:
              if keychain.exists():
                  subprocess.run(['security','delete-keychain',str(keychain)],capture_output=True)
              for name in ['certificate.p12','profile.mobileprovision']:
                  (folder / name).unlink(missing_ok=True)
          PY
