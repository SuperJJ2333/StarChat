name: Account-switch native evidence (host failures retained)
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  simulator:
    name: iPhone 15 iOS ${{ matrix.ios }}
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: '16.4'
            ios: 18
          - xcode: '26.3'
            ios: 26
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Bind unchanged frozen application tree
        run: |
          test "$(git rev-parse HEAD:apps)" = "$(git rev-parse 11b72ec7754179370926377ade0a16e578801349:apps)"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Select exact runtime and fresh iPhone 15
        env:
          IOS_MAJOR: ${{ matrix.ios }}
        run: |
          mkdir -p "$RUNNER_TEMP/compatibility"
          xcodebuild -version | tee "$RUNNER_TEMP/compatibility/toolchain.txt"
          xcrun simctl list runtimes -j > "$RUNNER_TEMP/compatibility/runtimes.json"
          python3 <<'PY'
          import json, os, pathlib, subprocess
          folder = pathlib.Path(os.environ['RUNNER_TEMP']) / 'compatibility'
          runtimes = json.loads((folder / 'runtimes.json').read_text())['runtimes']
          candidates = [r for r in runtimes if r.get('isAvailable') and r['name'].startswith('iOS ') and r['version'].split('.')[0] == os.environ['IOS_MAJOR']]
          assert candidates, 'Requested iOS major runtime unavailable; no silent substitution'
          runtime = max(candidates, key=lambda r: tuple(map(int, r['version'].split('.'))))
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devicetypes', '-j']))['devicetypes']
          device = next(d for d in devices if d['name'] == 'iPhone 15')
          udid = subprocess.check_output(['xcrun', 'simctl', 'create', 'ChatFlow compatibility', device['identifier'], runtime['identifier']], text=True).strip()
          (folder / 'selected.json').write_text(json.dumps({'runtime': runtime, 'device': device['name']}, indent=2))
          with open(os.environ['GITHUB_ENV'], 'a') as f: f.write('SIMULATOR_ID=' + udid + '\n')
          print('Selected iPhone 15 / iOS ' + runtime['version'])
          subprocess.run(['xcrun', 'simctl', 'boot', udid], check=True)
          subprocess.run(['xcrun', 'simctl', 'bootstatus', udid, '-b'], check=True)
          PY
      - name: Resolve complete host dependencies
        working-directory: apps/mobile_flutter
        run: flutter pub get
      - name: Test corrected media and direct-room paths
        id: host_shared
        continue-on-error: true
        working-directory: apps/mobile_flutter
        run: flutter test --no-pub test/features/matrix/voice_audio_source_test.dart test/features/matrix/voice_playback_controller_test.dart test/features/matrix/direct_chat_sync_failure_test.dart test/features/matrix/canonical_direct_chat_test.dart test/features/matrix/video_playback_extension_test.dart test/features/matrix/video_viewer_cache_test.dart test/features/matrix/group_announcement_sdk_recovery_test.dart test/features/matrix/search_media_resolver_test.dart test/features/matrix/room_search_media_grid_test.dart test/features/matrix/room_search_context_test.dart test/features/matrix/matrix_room_history_date_capability_test.dart test/features/matrix/room_offline_loading_test.dart test/features/matrix/matrix_room_timeline_adapter_test.dart test/features/matrix/global_search_room_anchor_integration_test.dart test/features/auth
      - name: Configure simulator-only dependencies
        working-directory: apps/mobile_flutter
        run: |
          # The shipped scanner's MLKit binary has no arm64 simulator slice.
          # Exclude only scanning from this synthetic media/storage harness.
          python3 <<'PY'
          import pathlib
          p = pathlib.Path('pubspec.yaml')
          content = p.read_text()
          assert content.count('  mobile_scanner: 6.0.11\n') == 1
          p.write_text(content.replace('  mobile_scanner: 6.0.11\n', ''))
          PY
          echo 'Diagnostic-only exclusion: mobile_scanner 6.0.11 (MLKit lacks arm64 simulator); scanning and full production plugin combination not covered.' > "$RUNNER_TEMP/compatibility/limitations.txt"
          flutter config --no-enable-swift-package-manager
          flutter pub get
          flutter build ios --simulator --debug --config-only --no-codesign -t integration_test/ios_compatibility_test.dart --dart-define=COMPAT_PHASE=seed
      - name: Native media and seed encrypted history
        id: seed
        timeout-minutes: 22
        working-directory: apps/mobile_flutter
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/compatibility/seed.log"
          bundle_id="com.liuhetong.liuhetongMobile"

          # flutter_tools on simulators discovers the VM service URL solely from
          # a `simctl spawn log stream` session and waits forever when that
          # session delivers nothing (intermittent on the iOS 18 runtime;
          # healthy launches print the URL within seconds). Bound each attempt:
          # if the Waiting line is not followed by the URL within the grace
          # window, kill the attempt and retry. Only stalls are retried; real
          # test failures must surface unchanged. Retrying seed is safe because
          # tests are never driven without the tool connection, so the
          # diagnostic container stays fresh.
          watch_vm_service() {
            attempt_pid="$1"
            attempt_log="$2"
            grace_seconds="$3"
            marked_at=""
            while kill -0 "$attempt_pid" 2>/dev/null; do
              if [ -z "$marked_at" ] && grep -q "Waiting for VM Service port to be available" "$attempt_log" 2>/dev/null; then
                marked_at=$(date +%s)
              fi
              if [ -n "$marked_at" ] && grep -q "VM Service URL on device" "$attempt_log" 2>/dev/null; then
                marked_at=""
              fi
              if [ -n "$marked_at" ] && [ $(( $(date +%s) - marked_at )) -ge "$grace_seconds" ]; then
                echo "VM service discovery stalled for ${grace_seconds}s; terminating attempt for retry."
                kill -TERM -- "-$attempt_pid" 2>/dev/null || kill -TERM "$attempt_pid" 2>/dev/null || true
                sleep 5
                kill -KILL -- "-$attempt_pid" 2>/dev/null || kill -KILL "$attempt_pid" 2>/dev/null || true
                return 1
              fi
              sleep 5
            done
            return 0
          }

          set -m
          attempt=1
          while [ "$attempt" -le 3 ]; do
            echo "Compatibility seed attempt ${attempt}/3"
            rm -f "$log"
            flutter test integration_test/ios_compatibility_test.dart \
              -d "$SIMULATOR_ID" \
              --no-uninstall \
              --timeout=2m \
              --dart-define=COMPAT_PHASE=seed \
              --reporter expanded \
              --verbose > "$log" 2>&1 &
            flutter_pid=$!
            stalled=0
            if ! watch_vm_service "$flutter_pid" "$log" 60; then
              stalled=1
            fi
            wait "$flutter_pid" 2>/dev/null || rc=$?
            if [ -z "${rc:-}" ]; then rc=0; fi
            set +m
            cat "$log"
            if [ "$rc" -eq 0 ]; then
              exit 0
            fi
            if [ "$stalled" -ne 1 ]; then
              echo "Seed attempt failed with exit code ${rc}; not a VM service stall, not retrying."
              exit "$rc"
            fi
            if [ "$attempt" -lt 3 ]; then
              xcrun simctl terminate "$SIMULATOR_ID" "$bundle_id" || true
              sleep 3
            fi
            unset rc
            attempt=$((attempt + 1))
          done
          echo "All seed attempts stalled on VM service discovery."
          exit 1
      - name: Verify retained history in a new app process
        if: ${{ !cancelled() && (steps.seed.outcome == 'success' || steps.seed.outcome == 'failure') }}
        timeout-minutes: 12
        working-directory: apps/mobile_flutter
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/compatibility/verify.log"
          bundle_id="com.liuhetong.liuhetongMobile"
          xcrun simctl terminate "$SIMULATOR_ID" "$bundle_id" || true
          python3 <<'PY'
          import os, pathlib, subprocess
          container = pathlib.Path(subprocess.check_output(['xcrun', 'simctl', 'get_app_container', os.environ['SIMULATOR_ID'], 'com.liuhetong.liuhetongMobile', 'data'], text=True).strip())
          exists = any(container.rglob('ios_compatibility.sqlite'))
          print('Retained seed database exists: ' + str(exists))
          assert exists, 'Seed database absent before reinstall/verify; cannot claim persistence'
          PY

          # Same bounded discovery as the seed step: a stalled simulator log
          # stream otherwise hangs until the step timeout.
          watch_vm_service() {
            attempt_pid="$1"
            attempt_log="$2"
            grace_seconds="$3"
            marked_at=""
            while kill -0 "$attempt_pid" 2>/dev/null; do
              if [ -z "$marked_at" ] && grep -q "Waiting for VM Service port to be available" "$attempt_log" 2>/dev/null; then
                marked_at=$(date +%s)
              fi
              if [ -n "$marked_at" ] && grep -q "VM Service URL on device" "$attempt_log" 2>/dev/null; then
                marked_at=""
              fi
              if [ -n "$marked_at" ] && [ $(( $(date +%s) - marked_at )) -ge "$grace_seconds" ]; then
                echo "VM service discovery stalled for ${grace_seconds}s; terminating attempt for retry."
                kill -TERM -- "-$attempt_pid" 2>/dev/null || kill -TERM "$attempt_pid" 2>/dev/null || true
                sleep 5
                kill -KILL -- "-$attempt_pid" 2>/dev/null || kill -KILL "$attempt_pid" 2>/dev/null || true
                return 1
              fi
              sleep 5
            done
            return 0
          }

          set -m
          attempt=1
          while [ "$attempt" -le 3 ]; do
            echo "Compatibility verify attempt ${attempt}/3"
            rm -f "$log"
            flutter test integration_test/ios_compatibility_test.dart \
              -d "$SIMULATOR_ID" \
              --no-uninstall \
              --timeout=2m \
              --dart-define=COMPAT_PHASE=verify \
              --reporter expanded \
              --verbose > "$log" 2>&1 &
            flutter_pid=$!
            stalled=0
            if ! watch_vm_service "$flutter_pid" "$log" 60; then
              stalled=1
            fi
            wait "$flutter_pid" 2>/dev/null || rc=$?
            if [ -z "${rc:-}" ]; then rc=0; fi
            set +m
            cat "$log"
            if [ "$rc" -eq 0 ]; then
              exit 0
            fi
            if [ "$stalled" -ne 1 ]; then
              echo "Verify attempt failed with exit code ${rc}; not a VM service stall, not retrying."
              exit "$rc"
            fi
            if [ "$attempt" -lt 3 ]; then
              xcrun simctl terminate "$SIMULATOR_ID" "$bundle_id" || true
              sleep 3
            fi
            unset rc
            attempt=$((attempt + 1))
          done
          echo "All verify attempts stalled on VM service discovery."
          exit 1
      - name: Collect simulator launch diagnostics
        if: ${{ always() && env.SIMULATOR_ID != '' }}
        timeout-minutes: 2
        run: |
          xcrun simctl spawn "$SIMULATOR_ID" log show --last 30m --style compact --predicate 'process == "Runner"' > "$RUNNER_TEMP/compatibility/runner-console.log" 2>&1 || true
          python3 <<'PY'
          import os, pathlib, shutil
          source = pathlib.Path.home() / 'Library/Logs/DiagnosticReports'
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'compatibility'
          for path in source.glob('Runner*'):
              if path.is_file(): shutil.copy2(path, target / path.name)
          PY
      - name: Preserve synthetic diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone15-ios${{ matrix.ios }}-compatibility
          path: ${{ runner.temp }}/compatibility/
          retention-days: 14

      - name: Preserve the original host failure as a failing gate
        if: always()
        env:
          HOST_OUTCOME: ${{ steps.host_shared.outcome }}
        run: test "$HOST_OUTCOME" = "success"
  unchanged-host-baseline:
    name: Compare unchanged video host failure against 16905e7f
    runs-on: macos-15
    timeout-minutes: 18
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      PUB_HOSTED_URL: https://pub.dev
      FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Capture identical inputs and run original baseline assertions
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/host-baseline"
          xcodebuild -version > "$RUNNER_TEMP/host-baseline/toolchain.txt"
          flutter --version >> "$RUNNER_TEMP/host-baseline/toolchain.txt"
          sw_vers >> "$RUNNER_TEMP/host-baseline/toolchain.txt"
          printf '%s\n' "$ImageVersion" >> "$RUNNER_TEMP/host-baseline/toolchain.txt"
          git diff --exit-code 16905e7fa81a5d7a7595bd89020e30c594ae2b53 11b72ec7754179370926377ade0a16e578801349 -- apps/mobile_flutter/test/features/matrix/video_playback_extension_test.dart apps/mobile_flutter/lib/features/matrix/media_cache.dart apps/mobile_flutter/lib/features/matrix/media_index.dart apps/mobile_flutter/lib/features/matrix/media_disk_quota_index.dart apps/mobile_flutter/lib/core/local_database_factory.dart apps/mobile_flutter/third_party/matrix/lib/src/database/sqflite_encryption_helper/io.dart apps/mobile_flutter/pubspec.lock
          git worktree add --detach "$RUNNER_TEMP/baseline-source" 16905e7fa81a5d7a7595bd89020e30c594ae2b53
          cd "$RUNNER_TEMP/baseline-source/apps/mobile_flutter"
          flutter pub get --enforce-lockfile
          shasum -a 256 pubspec.lock > "$RUNNER_TEMP/host-baseline/lock.sha256"
          cat > "$RUNNER_TEMP/host-baseline/loader-probe.dart" <<'DART'
          import 'dart:convert';
          import 'dart:ffi';
          void main() {
            try {
              DynamicLibrary.open('sqlcipher_flutter_libs.framework/Versions/Current/sqlcipher_flutter_libs');
              print(jsonEncode({'library_loaded':true}));
            } catch (e) {
              print(jsonEncode({'library_loaded':false,'error_type':e.runtimeType.toString()}));
            }
          }
          DART
          dart "$RUNNER_TEMP/host-baseline/loader-probe.dart" > "$RUNNER_TEMP/host-baseline/loader.json"
          set +e
          flutter test --no-pub --concurrency=1 --reporter=json test/features/matrix/video_playback_extension_test.dart > "$RUNNER_TEMP/host-baseline/baseline.jsonl" 2>&1
          result=$?
          set -e
          RESULT="$result" python3 <<'PY'
          import json,os,pathlib
          folder=pathlib.Path(os.environ['RUNNER_TEMP'])/'host-baseline'
          names={};failed=[];counts={}
          for line in (folder/'baseline.jsonl').read_text().splitlines():
              try:event=json.loads(line)
              except ValueError:continue
              if event.get('type')=='testStart':names[event['test']['id']]=event['test']['name']
              if event.get('type')=='testDone' and not event.get('hidden'):
                  result='skipped' if event.get('skipped') else event.get('result')
                  counts[result]=counts.get(result,0)+1
                  if result not in ('success','skipped'):failed.append(names.get(event['testID'],'unknown'))
          expected={'MP4 playback receives container suffix and keeps one governed file','store after migration reuses typed file and its integrity metadata','concurrent migration and store complete with one usable cache file'}
          report={'baseline':'16905e7fa81a5d7a7595bd89020e30c594ae2b53','candidate_mobile':'11b72ec7754179370926377ade0a16e578801349','exit':int(os.environ['RESULT']),'counts':counts,'failed_names':failed,'scope':'Comparison proves only the exact old host failures. Original host gate remains FAIL; no assertion removed. Loader probe is separate evidence, not assumed sole cause.'}
          (folder/'comparison.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report))
          assert int(os.environ['RESULT'])==1 and set(failed)==expected and len(failed)==3
          PY
      - name: Preserve unmodified baseline failures and toolchain
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unchanged-host-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/host-baseline/
          if-no-files-found: error
          retention-days: 14
