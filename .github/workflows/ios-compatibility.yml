name: iPhone 15 native compatibility
on:
  push:
    branches: [main, codex/ios-compatibility, codex/mobile-parity-20260909]
    paths:
      - 'apps/mobile_flutter/**'
      - '.github/workflows/ios-compatibility.yml'
      - 'scripts/generate_ios_compatibility_fixtures.py'
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile_flutter/**'
      - '.github/workflows/ios-compatibility.yml'
      - 'scripts/generate_ios_compatibility_fixtures.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-compile:
    name: Complete production iOS native compile
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Compile complete device app without signing
        working-directory: apps/mobile_flutter
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/production-compile"
          xcodebuild -version | tee "$RUNNER_TEMP/production-compile/toolchain.txt"
          flutter --version >> "$RUNNER_TEMP/production-compile/toolchain.txt"
          flutter config --no-enable-swift-package-manager
          flutter pub get

          # CocoaPods downloads binary pods (notably OpenSSL-Universal) from
          # GitHub release assets, which intermittently answer 504/502. A single
          # attempt therefore fails for reasons unrelated to our code or Xcode,
          # so retry the whole dependency-install + build operation with backoff.
          # Each attempt keeps its own log; the artifact upload below uses
          # `if: always()` so failed attempts stay available for diagnosis.
          for attempt in 1 2 3; do
            echo "iOS build attempt ${attempt}/3"
            if flutter build ios --release --no-codesign 2>&1 \
                | tee "$RUNNER_TEMP/production-compile/production-compile-attempt-${attempt}.log"; then
              echo "iOS build succeeded on attempt ${attempt}/3"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 20))
              echo "Build attempt ${attempt} failed; retrying in ${delay}s..."
              sleep "$delay"
            fi
          done

          echo "All iOS build attempts failed"
          exit 1
      - name: Preserve full production compilation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-production-ios-compile
          path: ${{ runner.temp }}/production-compile/
          retention-days: 14
  simulator:
    name: iPhone 15 iOS ${{ matrix.ios }}
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: '16.4'
            ios: 18
          - xcode: '26.3'
            ios: 26
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Select exact runtime and fresh iPhone 15
        env:
          IOS_MAJOR: ${{ matrix.ios }}
        run: |
          mkdir -p "$RUNNER_TEMP/compatibility"
          xcodebuild -version | tee "$RUNNER_TEMP/compatibility/toolchain.txt"
          xcrun simctl list runtimes -j > "$RUNNER_TEMP/compatibility/runtimes.json"
          python3 <<'PY'
          import json, os, pathlib, subprocess
          folder = pathlib.Path(os.environ['RUNNER_TEMP']) / 'compatibility'
          runtimes = json.loads((folder / 'runtimes.json').read_text())['runtimes']
          candidates = [r for r in runtimes if r.get('isAvailable') and r['name'].startswith('iOS ') and r['version'].split('.')[0] == os.environ['IOS_MAJOR']]
          assert candidates, 'Requested iOS major runtime unavailable; no silent substitution'
          runtime = max(candidates, key=lambda r: tuple(map(int, r['version'].split('.'))))
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devicetypes', '-j']))['devicetypes']
          device = next(d for d in devices if d['name'] == 'iPhone 15')
          udid = subprocess.check_output(['xcrun', 'simctl', 'create', 'ChatFlow compatibility', device['identifier'], runtime['identifier']], text=True).strip()
          (folder / 'selected.json').write_text(json.dumps({'runtime': runtime, 'device': device['name']}, indent=2))
          with open(os.environ['GITHUB_ENV'], 'a') as f: f.write('SIMULATOR_ID=' + udid + '\n')
          print('Selected iPhone 15 / iOS ' + runtime['version'])
          subprocess.run(['xcrun', 'simctl', 'boot', udid], check=True)
          subprocess.run(['xcrun', 'simctl', 'bootstatus', udid, '-b'], check=True)
          PY
      - name: Resolve dependencies
        working-directory: apps/mobile_flutter
        run: |
          # The shipped scanner's MLKit binary has no arm64 simulator slice.
          # Exclude only scanning from this synthetic media/storage harness.
          python3 <<'PY'
          import pathlib
          p = pathlib.Path('pubspec.yaml')
          content = p.read_text()
          assert content.count('  mobile_scanner: 6.0.11\n') == 1
          p.write_text(content.replace('  mobile_scanner: 6.0.11\n', ''))
          PY
          echo 'Diagnostic-only exclusion: mobile_scanner 6.0.11 (MLKit lacks arm64 simulator); scanning and full production plugin combination not covered.' > "$RUNNER_TEMP/compatibility/limitations.txt"
          flutter config --no-enable-swift-package-manager
          flutter pub get
          flutter build ios --simulator --debug --config-only --no-codesign -t integration_test/ios_compatibility_test.dart --dart-define=COMPAT_PHASE=seed
      - name: Test corrected media and direct-room paths
        working-directory: apps/mobile_flutter
        run: flutter test --no-pub test/features/matrix/voice_audio_source_test.dart test/features/matrix/voice_playback_controller_test.dart test/features/matrix/direct_chat_sync_failure_test.dart test/features/matrix/canonical_direct_chat_test.dart test/features/matrix/video_playback_extension_test.dart test/features/matrix/video_viewer_cache_test.dart
      - name: Native media and seed encrypted history
        id: seed
        timeout-minutes: 22
        working-directory: apps/mobile_flutter
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/compatibility/seed.log"
          bundle_id="com.liuhetong.liuhetongMobile"

          # flutter_tools on simulators discovers the VM service URL solely from
          # a `simctl spawn log stream` session and waits forever when that
          # session delivers nothing (intermittent on the iOS 18 runtime;
          # healthy launches print the URL within seconds). Bound each attempt:
          # if the Waiting line is not followed by the URL within the grace
          # window, kill the attempt and retry. Only stalls are retried; real
          # test failures must surface unchanged. Retrying seed is safe because
          # tests are never driven without the tool connection, so the
          # diagnostic container stays fresh.
          watch_vm_service() {
            attempt_pid="$1"
            attempt_log="$2"
            grace_seconds="$3"
            marked_at=""
            while kill -0 "$attempt_pid" 2>/dev/null; do
              if [ -z "$marked_at" ] && grep -q "Waiting for VM Service port to be available" "$attempt_log" 2>/dev/null; then
                marked_at=$(date +%s)
              fi
              if [ -n "$marked_at" ] && grep -q "VM Service URL on device" "$attempt_log" 2>/dev/null; then
                marked_at=""
              fi
              if [ -n "$marked_at" ] && [ $(( $(date +%s) - marked_at )) -ge "$grace_seconds" ]; then
                echo "VM service discovery stalled for ${grace_seconds}s; terminating attempt for retry."
                kill -TERM -- "-$attempt_pid" 2>/dev/null || kill -TERM "$attempt_pid" 2>/dev/null || true
                sleep 5
                kill -KILL -- "-$attempt_pid" 2>/dev/null || kill -KILL "$attempt_pid" 2>/dev/null || true
                return 1
              fi
              sleep 5
            done
            return 0
          }

          set -m
          attempt=1
          while [ "$attempt" -le 3 ]; do
            echo "Compatibility seed attempt ${attempt}/3"
            rm -f "$log"
            flutter test integration_test/ios_compatibility_test.dart \
              -d "$SIMULATOR_ID" \
              --no-uninstall \
              --timeout=2m \
              --dart-define=COMPAT_PHASE=seed \
              --reporter expanded \
              --verbose > "$log" 2>&1 &
            flutter_pid=$!
            stalled=0
            if ! watch_vm_service "$flutter_pid" "$log" 60; then
              stalled=1
            fi
            wait "$flutter_pid" 2>/dev/null || rc=$?
            if [ -z "${rc:-}" ]; then rc=0; fi
            set +m
            cat "$log"
            if [ "$rc" -eq 0 ]; then
              exit 0
            fi
            if [ "$stalled" -ne 1 ]; then
              echo "Seed attempt failed with exit code ${rc}; not a VM service stall, not retrying."
              exit "$rc"
            fi
            if [ "$attempt" -lt 3 ]; then
              xcrun simctl terminate "$SIMULATOR_ID" "$bundle_id" || true
              sleep 3
            fi
            unset rc
            attempt=$((attempt + 1))
          done
          echo "All seed attempts stalled on VM service discovery."
          exit 1
      - name: Verify retained history in a new app process
        if: ${{ !cancelled() && (steps.seed.outcome == 'success' || steps.seed.outcome == 'failure') }}
        timeout-minutes: 12
        working-directory: apps/mobile_flutter
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/compatibility/verify.log"
          bundle_id="com.liuhetong.liuhetongMobile"
          xcrun simctl terminate "$SIMULATOR_ID" "$bundle_id" || true
          python3 <<'PY'
          import os, pathlib, subprocess
          container = pathlib.Path(subprocess.check_output(['xcrun', 'simctl', 'get_app_container', os.environ['SIMULATOR_ID'], 'com.liuhetong.liuhetongMobile', 'data'], text=True).strip())
          exists = any(container.rglob('ios_compatibility.sqlite'))
          print('Retained seed database exists: ' + str(exists))
          assert exists, 'Seed database absent before reinstall/verify; cannot claim persistence'
          PY

          # Same bounded discovery as the seed step: a stalled simulator log
          # stream otherwise hangs until the step timeout.
          watch_vm_service() {
            attempt_pid="$1"
            attempt_log="$2"
            grace_seconds="$3"
            marked_at=""
            while kill -0 "$attempt_pid" 2>/dev/null; do
              if [ -z "$marked_at" ] && grep -q "Waiting for VM Service port to be available" "$attempt_log" 2>/dev/null; then
                marked_at=$(date +%s)
              fi
              if [ -n "$marked_at" ] && grep -q "VM Service URL on device" "$attempt_log" 2>/dev/null; then
                marked_at=""
              fi
              if [ -n "$marked_at" ] && [ $(( $(date +%s) - marked_at )) -ge "$grace_seconds" ]; then
                echo "VM service discovery stalled for ${grace_seconds}s; terminating attempt for retry."
                kill -TERM -- "-$attempt_pid" 2>/dev/null || kill -TERM "$attempt_pid" 2>/dev/null || true
                sleep 5
                kill -KILL -- "-$attempt_pid" 2>/dev/null || kill -KILL "$attempt_pid" 2>/dev/null || true
                return 1
              fi
              sleep 5
            done
            return 0
          }

          set -m
          attempt=1
          while [ "$attempt" -le 3 ]; do
            echo "Compatibility verify attempt ${attempt}/3"
            rm -f "$log"
            flutter test integration_test/ios_compatibility_test.dart \
              -d "$SIMULATOR_ID" \
              --no-uninstall \
              --timeout=2m \
              --dart-define=COMPAT_PHASE=verify \
              --reporter expanded \
              --verbose > "$log" 2>&1 &
            flutter_pid=$!
            stalled=0
            if ! watch_vm_service "$flutter_pid" "$log" 60; then
              stalled=1
            fi
            wait "$flutter_pid" 2>/dev/null || rc=$?
            if [ -z "${rc:-}" ]; then rc=0; fi
            set +m
            cat "$log"
            if [ "$rc" -eq 0 ]; then
              exit 0
            fi
            if [ "$stalled" -ne 1 ]; then
              echo "Verify attempt failed with exit code ${rc}; not a VM service stall, not retrying."
              exit "$rc"
            fi
            if [ "$attempt" -lt 3 ]; then
              xcrun simctl terminate "$SIMULATOR_ID" "$bundle_id" || true
              sleep 3
            fi
            unset rc
            attempt=$((attempt + 1))
          done
          echo "All verify attempts stalled on VM service discovery."
          exit 1
      - name: Collect simulator launch diagnostics
        if: ${{ always() && env.SIMULATOR_ID != '' }}
        timeout-minutes: 2
        run: |
          xcrun simctl spawn "$SIMULATOR_ID" log show --last 30m --style compact --predicate 'process == "Runner"' > "$RUNNER_TEMP/compatibility/runner-console.log" 2>&1 || true
          python3 <<'PY'
          import os, pathlib, shutil
          source = pathlib.Path.home() / 'Library/Logs/DiagnosticReports'
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'compatibility'
          for path in source.glob('Runner*'):
              if path.is_file(): shutil.copy2(path, target / path.name)
          PY
      - name: Preserve synthetic diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone15-ios${{ matrix.ios }}-compatibility
          path: ${{ runner.temp }}/compatibility/
          retention-days: 14
