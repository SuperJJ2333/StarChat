name: iPhone 15 native compatibility
on:
  push:
    branches: [main, codex/ios-compatibility, codex/mobile-parity-20260909]
    paths:
      - 'apps/mobile_flutter/**'
      - '.github/workflows/ios-compatibility.yml'
      - 'scripts/generate_ios_compatibility_fixtures.py'
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile_flutter/**'
      - '.github/workflows/ios-compatibility.yml'
      - 'scripts/generate_ios_compatibility_fixtures.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    name: iPhone 15 iOS ${{ matrix.ios }}
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: '16.4'
            ios: 18
          - xcode: '26.3'
            ios: 26
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Select exact runtime and fresh iPhone 15
        env:
          IOS_MAJOR: ${{ matrix.ios }}
        run: |
          mkdir -p "$RUNNER_TEMP/compatibility"
          xcodebuild -version | tee "$RUNNER_TEMP/compatibility/toolchain.txt"
          xcrun simctl list runtimes -j > "$RUNNER_TEMP/compatibility/runtimes.json"
          python3 <<'PY'
          import json, os, pathlib, subprocess
          folder = pathlib.Path(os.environ['RUNNER_TEMP']) / 'compatibility'
          runtimes = json.loads((folder / 'runtimes.json').read_text())['runtimes']
          candidates = [r for r in runtimes if r.get('isAvailable') and r['name'].startswith('iOS ') and r['version'].split('.')[0] == os.environ['IOS_MAJOR']]
          assert candidates, 'Requested iOS major runtime unavailable; no silent substitution'
          runtime = max(candidates, key=lambda r: tuple(map(int, r['version'].split('.'))))
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devicetypes', '-j']))['devicetypes']
          device = next(d for d in devices if d['name'] == 'iPhone 15')
          udid = subprocess.check_output(['xcrun', 'simctl', 'create', 'ChatFlow compatibility', device['identifier'], runtime['identifier']], text=True).strip()
          (folder / 'selected.json').write_text(json.dumps({'runtime': runtime, 'device': device['name']}, indent=2))
          with open(os.environ['GITHUB_ENV'], 'a') as f: f.write('SIMULATOR_ID=' + udid + '\n')
          print('Selected iPhone 15 / iOS ' + runtime['version'])
          subprocess.run(['xcrun', 'simctl', 'boot', udid], check=True)
          subprocess.run(['xcrun', 'simctl', 'bootstatus', udid, '-b'], check=True)
          PY
      - name: Resolve dependencies
        working-directory: apps/mobile_flutter
        run: |
          # The shipped scanner's MLKit binary has no arm64 simulator slice.
          # Exclude only scanning from this synthetic media/storage harness.
          python3 <<'PY'
          import pathlib
          p = pathlib.Path('pubspec.yaml')
          content = p.read_text()
          assert content.count('  mobile_scanner: 5.2.3\n') == 1
          p.write_text(content.replace('  mobile_scanner: 5.2.3\n', ''))
          PY
          echo 'Diagnostic-only exclusion: mobile_scanner 5.2.3 (MLKit lacks arm64 simulator); scanning and full production plugin combination not covered.' > "$RUNNER_TEMP/compatibility/limitations.txt"
          flutter config --no-enable-swift-package-manager
          flutter pub get
          flutter build ios --simulator --debug --config-only --no-codesign -t integration_test/ios_compatibility_test.dart --dart-define=COMPAT_PHASE=seed
      - name: Test corrected media and direct-room paths
        working-directory: apps/mobile_flutter
        run: flutter test --no-pub test/features/matrix/voice_audio_source_test.dart test/features/matrix/voice_playback_controller_test.dart test/features/matrix/direct_chat_sync_failure_test.dart test/features/matrix/canonical_direct_chat_test.dart test/features/matrix/video_playback_extension_test.dart test/features/matrix/video_viewer_cache_test.dart
      - name: Native media and seed encrypted history
        id: seed
        timeout-minutes: 18
        working-directory: apps/mobile_flutter
        run: |
          set -o pipefail
          flutter test integration_test/ios_compatibility_test.dart -d "$SIMULATOR_ID" --no-uninstall --timeout=2m --dart-define=COMPAT_PHASE=seed --reporter expanded --verbose 2>&1 | tee "$RUNNER_TEMP/compatibility/seed.log"
      - name: Verify retained history in a new app process
        if: ${{ !cancelled() && (steps.seed.outcome == 'success' || steps.seed.outcome == 'failure') }}
        timeout-minutes: 10
        working-directory: apps/mobile_flutter
        run: |
          set -o pipefail
          xcrun simctl terminate "$SIMULATOR_ID" com.liuhetong.liuhetongMobile || true
          python3 <<'PY'
          import os, pathlib, subprocess
          container = pathlib.Path(subprocess.check_output(['xcrun', 'simctl', 'get_app_container', os.environ['SIMULATOR_ID'], 'com.liuhetong.liuhetongMobile', 'data'], text=True).strip())
          exists = any(container.rglob('ios_compatibility.sqlite'))
          print('Retained seed database exists: ' + str(exists))
          assert exists, 'Seed database absent before reinstall/verify; cannot claim persistence'
          PY
          flutter test integration_test/ios_compatibility_test.dart -d "$SIMULATOR_ID" --no-uninstall --timeout=2m --dart-define=COMPAT_PHASE=verify --reporter expanded --verbose 2>&1 | tee "$RUNNER_TEMP/compatibility/verify.log"
      - name: Collect simulator launch diagnostics
        if: ${{ always() && env.SIMULATOR_ID != '' }}
        timeout-minutes: 2
        run: |
          xcrun simctl spawn "$SIMULATOR_ID" log show --last 30m --style compact --predicate 'process == "Runner"' > "$RUNNER_TEMP/compatibility/runner-console.log" 2>&1 || true
          python3 <<'PY'
          import os, pathlib, shutil
          source = pathlib.Path.home() / 'Library/Logs/DiagnosticReports'
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'compatibility'
          for path in source.glob('Runner*'):
              if path.is_file(): shutil.copy2(path, target / path.name)
          PY
      - name: Preserve synthetic diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone15-ios${{ matrix.ios }}-compatibility
          path: ${{ runner.temp }}/compatibility/
          retention-days: 14
