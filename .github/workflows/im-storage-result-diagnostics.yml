name: Inspect existing IM storage XCTest result
on:
  push:
    branches: ['codex/im-storage-diagnose-*']
permissions:
  contents: read
  actions: read
jobs:
  inspect-result:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: im-native-storage-38113845125-1
          run-id: 38113845125
          github-token: ${{ github.token }}
          path: docs/verification/artifacts/2026-10-11/im-storage-ci-diagnosis
      - name: Export precise failure diagnostics without rebuilding
        run: |
          set -euo pipefail
          folder="$GITHUB_WORKSPACE/docs/verification/artifacts/2026-10-11/im-storage-ci-diagnosis"
          xcrun xcresulttool get object --legacy --format json --path "$folder/storage.xcresult" > "$folder/result.json"
          xcrun xcresulttool export attachments --path "$folder/storage.xcresult" --output-path "$folder/attachments"
          python3 - "$folder/result.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1]))
          def walk(value):
              if isinstance(value,dict):
                  kind=value.get('_type',{}).get('_name','')
                  if kind == 'TestFailureIssueSummary':
                      print(json.dumps(value,ensure_ascii=False))
                  else:
                      for nested in value.values(): walk(nested)
              elif isinstance(value,list):
                  for nested in value: walk(nested)
          walk(data)
          PY
          python3 - "$folder/attachments" <<'PY'
          import pathlib, sys
          for path in pathlib.Path(sys.argv[1]).rglob('*'):
              if path.is_file() and path.stat().st_size < 8192:
                  content = path.read_text(errors='replace')
                  if 'protection=' in content:
                      print('SYNTHETIC_STORAGE_CAPABILITIES ' + content)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: im-storage-result-diagnostics-${{ github.run_id }}
          path: |
            docs/verification/artifacts/2026-10-11/im-storage-ci-diagnosis/result.json
            docs/verification/artifacts/2026-10-11/im-storage-ci-diagnosis/attachments/
          retention-days: 14
