services:
  ios-call-gateway:
    image: starchat-ios-call-gateway:0.3.53-1
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    cpus: 1
    ports: ["127.0.0.1:8099:8000"]
    networks: [matrix-private]
    env_file: ["/etc/starchat/ios-call-gateway.env"]
    environment:
      DATABASE_PATH: /data/routes.sqlite
      APNS_KEY_PATH: /run/secrets/apns.p8
      APNS_ENVIRONMENT: production
    volumes:
      - routes:/data
      - ${APNS_KEY_FILE:?Set server-only APNS_KEY_FILE}:/run/secrets/apns.p8:ro
    tmpfs: ["/tmp:size=16m,mode=1777"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  routes:
networks:
  matrix-private:
    external: true
    name: ${MATRIX_DOCKER_NETWORK:?Set the existing trusted Synapse Docker network}
