# The pinned official Alpine image compiles stream + ssl_preread statically.

user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events { worker_connections 4096; }

http {
    access_log off;
    server {
        listen 127.0.0.1:8080;
        location = /health/live { return 200 'alive\n'; }
        location / { return 404; }
    }
}

stream {
    # Never log arbitrary SNI text, request paths, bodies or credentials.
    log_format edge '$remote_addr [$time_local] received=$bytes_received sent=$bytes_sent status=$status';
    access_log /dev/stdout edge;
    upstream hk_tls { server 207.56.8.8:443; }

    map $ssl_preread_server_name $edge_upstream {
        default unix:/var/run/edge-reject.sock;
        liuhetong888.com hk_tls;
        admin.liuhetong888.com hk_tls;
        www.liuhetong888.com hk_tls;
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_connect_timeout 10s;
        proxy_timeout 1h;
        proxy_pass $edge_upstream;
        # Directed tests only. No public API routing until trusted client IP gates pass.
    }
}
