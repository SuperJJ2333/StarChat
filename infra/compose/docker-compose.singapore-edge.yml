# Stateless phase 1 edge. Public API DNS still points directly to Hong Kong.
# Set both images to verified version@sha256 references in the deployment environment.
services:
  edge-nginx:
    image: "${EDGE_NGINX_IMAGE:?verified nginx:1.27.5-alpine digest required}"
    restart: unless-stopped
    network_mode: host
    read_only: true
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    volumes:
      - ../edge/nginx-edge.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /var/run:size=8m,mode=0755
      - /var/cache/nginx:size=16m,mode=0755
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 2 -O /dev/null http://127.0.0.1:8080/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 30s

  edge-coturn:
    image: "${EDGE_COTURN_IMAGE:?verified coturn:4.13.1-r0-alpine digest required}"
    restart: unless-stopped
    network_mode: host
    # Root can read the root-owned 0600 bind mount. No credential in argv/env.
    user: "0:0"
    read_only: true
    entrypoint: ["turnserver"]
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ${EDGE_TURN_CONFIG_FILE:?protected absolute config path required}:/etc/coturn/turnserver.conf:ro
    tmpfs:
      - /var/run:size=8m,mode=0755
      - /tmp:size=8m,mode=1777
      - /var/lib/coturn:size=8m,mode=0755
    cap_drop: ["ALL"]
    # The pinned binary has a NET_BIND_SERVICE file capability; excluding it
    # from the bounding set makes Linux reject exec before coturn starts.
    cap_add: ["NET_BIND_SERVICE"]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    # This is process/listener liveness; authenticated Allocate/relay is a separate gate.
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 && grep -qi ':0D96 ' /proc/net/udp || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 120s
