# R2: include once in http context, before the Matrix server include.
# Method-only branching also covers TRACE rejected before location selection.
map $request_method $chatflow_log_nontrace {
    default 1;
    TRACE 0;
}
map $request_method $chatflow_log_trace {
    default 0;
    TRACE 1;
}
log_format chatflow_trace_safe escape=json
    '{"time":"$time_iso8601","method":"TRACE",'
    '"status":$status,"bytes":$body_bytes_sent,'
    '"request_id":"$request_id"}';
