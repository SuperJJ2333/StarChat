# Include inside the existing Matrix TLS server. Existing synapse_upstream is MAIN.
# nginx-http.conf must already be included in http context. These replace the
# frozen effective inherited log; retain other location overrides (e.g. /ios-call).
access_log /var/log/nginx/access.log main if=$chatflow_log_nontrace;
access_log /var/log/nginx/access.log chatflow_trace_safe if=$chatflow_log_trace;
# Preserve the effective parent error_log /var/log/nginx/error.log notice.
# This prefix must precede generic regex routes.
location = /_synapse/client/chatflow/recovery/v1 {
    access_log off;
    error_log /dev/null crit;
    default_type application/json;
    add_header Cache-Control no-store always;
    return 403 '{"errcode":"M_FORBIDDEN","error":"Private resource"}';
}
location ^~ /_synapse/client/chatflow/recovery/v1/ {
    access_log off;
    error_log /dev/null crit;
    default_type application/json;
    add_header Cache-Control no-store always;
    return 403 '{"errcode":"M_FORBIDDEN","error":"Private resource"}';
}
location = /_matrix/client/unstable/com.starchat.recovery/v1 {
    access_log off;
    error_log /dev/null crit;
    default_type application/json;
    add_header Cache-Control no-store always;
    return 404 '{"errcode":"M_NOT_FOUND","error":"Recovery path required"}';
}
location ^~ /_matrix/client/unstable/com.starchat.recovery/v1/ {
    client_max_body_size 1m;
    client_body_buffer_size 1m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_no_cache 1;
    access_log off;
    error_log /dev/null crit;
    add_header Cache-Control no-store always;
    default_type application/json;
    # Reject any query before Synapse request logging can observe token sentinels.
    if ($args != "") { return 400 '{"errcode":"M_INVALID_PARAM","error":"Query parameters are forbidden"}'; }
    # Keep unsupported verbs inside the same bounded JSON/no-store contract,
    # including methods the native Resource base would reject before dispatch.
    if ($request_method !~ ^(GET|POST|PUT)$) { return 405 '{"errcode":"M_UNRECOGNIZED","error":"Recovery method not supported"}'; }
    error_page 413 = @chatflow_recovery_too_large;
    error_page 502 503 504 = @chatflow_recovery_unavailable;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-StarChat-Session $http_x_starchat_session;
    proxy_pass http://synapse_upstream/_synapse/client/chatflow/recovery/v1/;
}
location @chatflow_recovery_too_large {
    access_log off;
    error_log /dev/null crit;
    default_type application/json;
    add_header Cache-Control no-store always;
    return 413 '{"errcode":"M_TOO_LARGE","error":"Recovery request too large"}';
}
location @chatflow_recovery_unavailable {
    access_log off;
    error_log /dev/null crit;
    default_type application/json;
    add_header Cache-Control no-store always;
    return 503 '{"errcode":"M_VAULT_UNAVAILABLE","error":"Recovery temporarily unavailable"}';
}
