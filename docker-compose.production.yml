services:
  synapse:
    ports: !override
      - "127.0.0.1:${SYNAPSE_HTTP_PORT:-8008}:8008"

  element-web:
    ports: !override
      - "127.0.0.1:${ELEMENT_HTTP_PORT:-8080}:80"

  business-api:
    ports: !override
      - "127.0.0.1:${BUSINESS_API_HTTP_PORT:-8082}:8082"

  gateway:
    image: "${NGINX_IMAGE:?NGINX_IMAGE is required}"
    restart: unless-stopped
    depends_on:
      business-api:
        condition: service_healthy
      synapse:
        condition: service_started
      element-web:
        condition: service_started
    volumes:
      - ./data/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
