services:
  synapse:
    ports: !override
      - "127.0.0.1:${SYNAPSE_HTTP_PORT:-8008}:8008"

  element-web:
    ports: !override
      - "127.0.0.1:${ELEMENT_HTTP_PORT:-8080}:80"

  business-api:
    ports: !override
      - "127.0.0.1:${BUSINESS_API_HTTP_PORT:-8082}:8082"

  # TURN TLS 兜底（生产）：与 base 的 dev coturn 等价 + 挂载证书启用
  # turns:5349。命令列表整体重述（compose 对 list 采用覆盖合并）。
  # 443 不能用作 TURN TLS：宿主 443/tcp 由边缘层(caddy)、443/udp 由 QUIC
  # 占用（TCP-443 TURN 需 SNI 分流 + 独立域名证书，见 docs/TURN.md §443）。
  # 防火墙需放行 5349/tcp+udp（生产 2026-09-04 已放行；托管商安全组
  # 放行仍待人工，见 docs/TURN.md）。
  coturn:
    command:
      - "--no-cli"
      - "--fingerprint"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SHARED_SECRET:?TURN_SHARED_SECRET is required}"
      - "--realm=${MATRIX_SERVER_NAME:-matrix.localhost}"
      - "--external-ip=${TURN_EXTERNAL_IP:?TURN_EXTERNAL_IP is required}"
      - "--listening-port=3478"
      - "--tls-listening-port=5349"
      - "--cert=/etc/coturn/certs/fullchain.pem"
      - "--pkey=/etc/coturn/certs/privkey.pem"
      - "--min-port=49160"
      - "--max-port=49200"
    volumes:
      - ./data/nginx/certs:/etc/coturn/certs:ro
    ports: !override
      - "${TURN_PORT:-3478}:3478/udp"
      - "${TURN_PORT:-3478}:3478/tcp"
      - "5349:5349/tcp"
      - "5349:5349/udp"
      - "49160-49200:49160-49200/udp"

  gateway:
    image: "${NGINX_IMAGE:?NGINX_IMAGE is required}"
    restart: unless-stopped
    depends_on:
      business-api:
        condition: service_healthy
      synapse:
        condition: service_started
      element-web:
        condition: service_started
    volumes:
      - ./data/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/nginx/certs:/etc/nginx/certs:ro
      - ./frontend:/usr/share/nginx/html/admin:ro
    # 公网 80/443 由宿主边缘层（caddy）终止 TLS 后回源本网关——
    # 边缘层属仓库外资产（docs/RUNBOOK_PRODUCTION_CONFIG.md）。因此
    # 本网关只绑定回环 9443，绝不直接占用公网端口。
    ports:
      - "127.0.0.1:9443:443"
