name: liuhetong_mobile
publish_to: none
description: 畅聊 ChatFlow Android/iOS Flutter client
version: 0.3.34+37
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: 2.5.3
  matrix: ^0.34.0
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8
  file_selector: ^1.0.3
  image_picker: 1.1.2
  record: ^7.1.1
  path_provider: 2.1.5
  path: 1.9.1
  sqflite_common_ffi: 2.3.6
  sqlcipher_flutter_libs: 0.6.8
  flutter_olm: ^2.0.0
  flutter_openssl_crypto: ^0.5.0
  flutter_svg: 2.2.0
  url_launcher: 6.3.1
  image_cropper: ^12.2.1
  flutter_image_compress: 2.3.0
  package_info_plus: 8.3.0
  speech_to_text: 7.4.0
  flutter_webrtc: 0.12.11
  webrtc_interface: 1.5.1
  emoji_picker_flutter: 4.5.3
  crypto: 3.0.7
  characters: 1.4.1
  cached_network_image: 3.4.1
  flutter_cache_manager: 3.4.1
  flutter_local_notifications: 19.4.2
  timezone: 0.10.1
  photo_manager: ^3.12.0
  audioplayers: ^6.8.1
  video_compress: ^3.1.4
  wakelock_plus: ^1.3.3
  webview_flutter: ^4.10.0
  video_player: ^2.14.0
  mobile_scanner: 5.2.3
  qr_flutter: 4.1.0
  firebase_core: 4.14.0
  firebase_messaging: 16.6.0
  permission_handler: 12.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: 0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/landing.png
    - assets/emoji/
    - assets/emoji_vector/
    - assets/html/
    - assets/sounds/
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/app_icon.png
  adaptive_icon_foreground_inset: 17
  remove_alpha_ios: true
