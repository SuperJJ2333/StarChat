name: liuhetong_mobile
publish_to: none
description: 畅聊 Android/iOS Flutter client
version: 0.1.0+1
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  matrix: ^0.34.0
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8
  file_selector: ^1.0.3
  image_picker: 1.1.2
  record: ^7.1.1
  path_provider: 2.1.5
  path: 1.9.1
  sqflite_common_ffi: 2.3.6
  sqlcipher_flutter_libs: 0.6.8
  flutter_olm: ^2.0.0
  flutter_openssl_crypto: ^0.5.0
  flutter_svg: 2.2.0
  image_cropper: 9.1.0
  flutter_webrtc: 0.12.11
  webrtc_interface: 1.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: 0.14.4
  crypto: 3.0.7
flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/landing.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/app_icon.png
  remove_alpha_ios: true

