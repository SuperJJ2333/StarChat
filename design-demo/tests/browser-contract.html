<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Screen contract pending</title>
    <link rel="stylesheet" href="/src/styles/reset.css">
    <link rel="stylesheet" href="/src/styles/tokens.css">
    <link rel="stylesheet" href="/src/styles/primitives.css">
    <link rel="stylesheet" href="/src/styles/components.css">
  </head>
  <body data-test-result="pending">
    <main id="test-root"></main>
    <script type="module">
      try {
        const [{ registerComponents }, { screens }] = await Promise.all([
          import("/src/components/register.js"),
          import("/src/catalog/screens.js")
        ]);
        registerComponents();
        const targetModules = new Set(["auth", "messages", "chat", "calls"]);
        const targets = screens.filter((screen) => targetModules.has(screen.module));
        const root = document.querySelector("#test-root");
        for (const definition of targets) {
          const screen = await definition.component();
          root.append(screen);
          if (!screen.matches(`article.ui-screen[data-screen-id="${definition.id}"]`)) {
            throw new Error(`${definition.id} has an invalid screen root`);
          }
          if (!screen.querySelector(":scope > .ui-device > .c-status-bar")) {
            throw new Error(`${definition.id} does not strictly nest the status bar`);
          }
          if (screen.querySelectorAll("h1").length !== 1) {
            throw new Error(`${definition.id} must render exactly one h1`);
          }
        }

        const failedMessage = root.querySelector('[data-screen-id="chat-room-message-failed"]');
        if (!failedMessage?.textContent.includes("重新发送")) {
          throw new Error("failed message does not expose retry copy");
        }
        const deniedAttachment = root.querySelector('[data-screen-id="chat-attachment-permission-denied"]');
        if (!deniedAttachment?.textContent.includes("系统设置")) {
          throw new Error("attachment permission state lacks settings action");
        }
        const deniedCall = root.querySelector('[data-screen-id="calls-video-permission-denied"]');
        if (!deniedCall?.querySelector('[role="dialog"][aria-modal="true"]')) {
          throw new Error("call permission state lacks an accessible dialog");
        }
        const button = root.querySelector(".c-action-button");
        const bounds = button?.getBoundingClientRect();
        if (!bounds || bounds.height < 44) {
          throw new Error("action button touch target is below 44px");
        }

        document.body.dataset.testResult = "passed";
        document.body.dataset.screenCount = String(targets.length);
        document.title = "Screen contract passed";
      } catch (error) {
        document.body.dataset.testResult = "failed";
        document.body.dataset.testMessage = error.message;
        document.title = "Screen contract failed";
      }
    </script>
  </body>
</html>
