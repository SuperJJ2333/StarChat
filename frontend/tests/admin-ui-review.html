<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>后台人工补入账验收演示</title>
<link rel="stylesheet" href="../src/styles/reset.css"><link rel="stylesheet" href="../src/styles/tokens.css"><link rel="stylesheet" href="../src/styles/gallery.css"><link rel="stylesheet" href="../src/styles/admin-wallet.css"><link rel="stylesheet" href="../src/styles/admin-modern.css"><link rel="stylesheet" href="../src/styles/admin-users.css"></head>
<body class="admin-modern"><main class="admin-content" style="max-width:1100px;margin-inline:auto"><header class="admin-topbar" style="flex-wrap:wrap"><h1>后台操作验收</h1><span>隔离合成数据；不会连接或写入生产资金</span></header><nav class="admin-filters" aria-label="演示模块" style="display:flex;flex-wrap:wrap;gap:12px"><button class="admin-secondary" data-tab="manage">客服管理</button><button class="admin-secondary" data-tab="grant">客服点钻派发</button><button class="admin-secondary" data-tab="repair">充值补入账</button></nav><div id="app"></div><p id="result" class="admin-audit-note" role="status">选择“充值补入账”查看普通、阻断、无候选和窗口外人工补录流程。</p></main>
<script type="module">
import {supportPanel} from '../src/admin-support-panel.js';
import {walletRepairDialog} from '../src/admin-wallet-repair-dialog.js';
import {manualDepositCaseDialog} from '../src/admin-manual-deposit-case.js';
const txid='a'.repeat(64),storage=new Map(),record={txid,log_index:7,direction:'INFLOW',amount:'10.000000'};
const agents=[{id:'support-1',username:'service_001',nickname:'小畅',masked_email:'s***@example.test',roles:['SUPPORT_AGENT'],badge:'官方客服',dispatch_eligible:true}];
let scenario='pass',credited=false,manual,decision,operation;
const future=()=>new Date(Date.now()+90_000).toISOString();
const api={
 getSupportAgents:async()=>({items:agents,total:1}),command:async(path,body)=>path.includes('adjustments')?{amount:body.amount}:{},
 getDepositRepairCandidates:async()=>scenario==='empty'?{receipt_id:'receipt-empty',items:[]}:{receipt_id:'receipt-7',items:[{intent_id:'intent-7',username:'alice_007',nickname:'阿梨',expected_amount:'10.000000',network:'TRON',intent_status:'EXPIRED'}]},
 previewWalletRepair:async(_kind,body)=>({preview_id:'preview-7',digest:'demo-digest',expected_version:1,expires_at:future(),blockers:scenario==='blocked'?['AMOUNT_MISMATCH']:[],confirmation:{...body,intent_id:'intent-7',username:'alice_007',nickname:'阿梨',user_id:'user-7',amount:scenario==='blocked'?'9.000000':'10.000000',expected_amount:'10.000000',asset:'USDT',network:'TRON',official_address:'TDemoOfficial'}}),
 executeWalletRepair:async(_kind,body)=>{credited=true;operation={status:'EXECUTED',operation_id:body.operation_id,ledger_transaction_id:'ledger-demo-7',amount:'10.000000'};return operation;},getWalletRepair:async()=>operation,
 getManualDepositCaseContext:async()=>({receipt_id:'receipt-window',txid,log_index:7,amount:'10.000000',asset:'USDT',network:'TRON',user_id:'user-7',username:'alice_007',nickname:'阿梨',ordinary_intent_available:false,blockers:[],cases:manual?[manual]:[]}),
 createManualDepositCase:async body=>manual={case_id:'case-window',status:'PENDING_DECISION',...body,amount:'10.000000',asset:'USDT',network:'TRON',txid,log_index:7,username:'alice_007',nickname:'阿梨'},getManualDepositCase:async()=>manual,
 decideManualDepositCase:async(_id,body)=>{decision=body;manual={...manual,status:body.decision==='APPROVED'?'APPROVED':'REJECTED',decision:{...body,actor_id:'demo-owner',created_at:new Date().toISOString()}};return manual;},
 previewManualDepositCase:async()=>({preview_id:'preview-window',digest:'window-digest',expected_version:1,expires_at:future(),status:'VALIDATED',blockers:[],confirmation:manual}),
 executeManualDepositCase:async(_id,body)=>{operation={status:'EXECUTED',operation_id:body.operation_id,ledger_transaction_id:'ledger-window',case_id:'case-window'};manual={...manual,status:'EXECUTED',ledger_transaction_id:'ledger-window'};return operation;},getManualDepositCaseOperation:async()=>operation
};
const app=document.querySelector('#app'),result=document.querySelector('#result'),store={getItem:k=>storage.get(k)??null,setItem:(k,v)=>storage.set(k,v),removeItem:k=>storage.delete(k)};
function repair(){app.replaceChildren();const controls=document.createElement('section');controls.className='admin-card';controls.innerHTML='<h2>充值补入账</h2><p class="admin-audit-note">先选择场景，再打开真实补入账模块。预检只核对；确认勾选前不调用入账。</p>';
 const scenarios=document.createElement('div');scenarios.className='admin-filters';scenarios.style.cssText='display:flex;flex-wrap:wrap;gap:12px';for(const [id,label] of [['pass','普通通过'],['blocked','被阻断'],['empty','无候选']]){const b=document.createElement('button');b.className='admin-secondary';b.textContent=label;b.setAttribute('aria-pressed',String(scenario===id));if(scenario===id)b.classList.add('active');b.onclick=()=>{scenario=id;[...scenarios.children].forEach(x=>{x.setAttribute('aria-pressed',String(x===b));x.classList.toggle('active',x===b);});result.textContent=`当前场景：${label}`;};scenarios.append(b);}controls.append(scenarios);
 const open=document.createElement('button');open.className='admin-primary';open.textContent='打开充值补入账';open.onclick=()=>walletRepairDialog(api,record,{actorId:'demo-owner',storage:store,onCompleted:r=>{result.textContent=`已入账：${r.ledger_transaction_id??'账本编号待查询'}；父列表已刷新（合成状态：${credited?'已入账':'未入账'}）`;}});const manualOpen=document.createElement('button');manualOpen.className='admin-secondary';manualOpen.textContent='窗口外人工补录（独立审批）';manualOpen.onclick=()=>manualDepositCaseDialog(api,record,{actorId:'demo-owner',storage:store,onCompleted:r=>result.textContent=`人工补录已入账：${r.ledger_transaction_id}`});controls.append(open,manualOpen);app.append(controls);}
function mount(tab){app.replaceChildren();document.querySelectorAll('[data-tab]').forEach(b=>{const active=b.dataset.tab===tab;b.setAttribute('aria-pressed',String(active));b.classList.toggle('active',active);});if(tab==='manage'||tab==='grant'){app.append(supportPanel(api,{mode:tab}));result.textContent=tab==='manage'?'客服管理：合成资料，不保存至财务状态。':'客服点钻派发：合成响应，不写入财务状态。';}else repair();}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>mount(b.dataset.tab));mount(new URLSearchParams(location.search).get('tab')??'repair');
</script></body></html>
