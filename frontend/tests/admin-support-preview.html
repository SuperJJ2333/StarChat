<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>客服管理与点钻派发 · 合成演示</title><link rel="stylesheet" href="/src/styles/reset.css"><link rel="stylesheet" href="/src/styles/tokens.css"><link rel="stylesheet" href="/src/styles/gallery.css"><link rel="stylesheet" href="/src/styles/admin-modern.css"><style>.admin-support-preview .admin-main{margin-left:0}.admin-support-preview .admin-content{max-width:1280px;margin:0 auto;padding:28px}@media(max-width:760px){.admin-support-preview .admin-content{padding:16px}}</style></head>
<body class="admin-page admin-support-preview" data-synthetic="true"><main class="admin-modern"><div class="admin-main"><header class="admin-topbar"><h1>客服管理</h1><div class="admin-topbar-actions"><span class="admin-actor">合成演示数据</span></div></header><div class="admin-content"><div class="admin-heading"><div><h1>客服管理与点钻派发</h1><p>仅合成数据，不连接生产服务或写入资金。</p></div></div><nav class="admin-support-preview-tabs" aria-label="客服功能演示"><button type="button" class="admin-secondary" data-mode="manage">客服管理</button><button type="button" class="admin-secondary" data-mode="grant">点钻派发</button></nav><p class="admin-audit-note">演示状态：<strong id="mode-label">客服管理</strong> · 含长昵称、脱敏邮箱和中文客服后缀。</p><div id="app"></div></div></div></main>
<script type="module">
import {supportPanel} from '/src/admin-support-panel.js';
const agents=[
 {id:'support-1',username:'support-20260913-001',nickname:'客服小王与华南夜班服务协调专员',masked_email:'support.long.alias.for.preview@example.com',roles:['SUPPORT_AGENT'],badge:'官方客服',dispatch_eligible:true},
 {id:'support-2',username:'finance-20260913-002',nickname:'财务客服李思思',masked_email:'finance.l***@example.com',roles:['FINANCE_SUPPORT'],badge:'专属客服',dispatch_eligible:true},
 {id:'support-3',username:'queue-20260913-003',nickname:'审核联络专员陈晨',masked_email:'q***@example.com',roles:['SUPPORT_SUPERVISOR'],badge:'服务主管',dispatch_eligible:false}
];
const api={getSupportAgents:async({query='',dispatch_eligible,limit=25,offset=0}={})=>{const normalized=query.toLowerCase();const matching=agents.filter(agent=>(!normalized||[agent.username,agent.nickname,agent.masked_email].some(value=>value.toLowerCase().includes(normalized)))&&(!dispatch_eligible||agent.dispatch_eligible));return {items:matching.slice(offset,offset+limit),total:matching.length};},command:async(path,body)=>{if(path.includes('support-roles')&&body?.role_code){const agent=agents.find(item=>item.id===path.split('/').at(-1));if(agent){agent.roles=[body.role_code];agent.badge=body.badge;}return {status:'ASSIGNED'};}if(path.includes('support-roles'))return {status:'REVOKED'};return {status:'POSTED',amount:body.amount};}};
const app=document.querySelector('#app'),modeLabel=document.querySelector('#mode-label');
const render=mode=>{app.replaceChildren(supportPanel(api,{mode}));modeLabel.textContent=mode==='manage'?'客服管理':'客服点钻派发';document.querySelectorAll('[data-mode]').forEach(button=>button.classList.toggle('active',button.dataset.mode===mode));};
document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>render(button.dataset.mode)));render('manage');
</script></body></html>
