<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>畅聊 ChatFlow · 管理台视觉 Demo</title>
  <link rel="stylesheet" href="/src/styles/reset.css">
  <link rel="stylesheet" href="/src/styles/tokens.css">
  <style>
    body{min-height:100vh;background:var(--admin-page);color:var(--admin-ink);font-family:var(--font-sans)}
    main{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:64px 0}
    .eyebrow{color:var(--admin-brand-strong);font-size:12px;font-weight:700;letter-spacing:.12em}
    h1{max-width:760px;margin:12px 0;font-size:clamp(32px,5vw,56px);line-height:1.1}.intro{max-width:640px;color:var(--admin-muted);font-size:17px;line-height:1.7}
    .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:36px}.card{padding:28px;border:1px solid var(--admin-border);border-radius:var(--admin-radius-md);background:var(--admin-surface);box-shadow:var(--admin-shadow)}
    h2{margin:0 0 8px;font-size:22px}.card p{min-height:48px;margin:0;color:var(--admin-muted);line-height:1.6}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}.button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border:1px solid var(--admin-brand);border-radius:10px;background:var(--admin-brand);color:var(--color-on-accent);font-weight:700;text-decoration:none}.button.secondary{border-color:var(--admin-border);background:var(--admin-surface);color:var(--admin-ink)}
    @media(max-width:700px){main{padding:40px 0}.cards{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">CHATFLOW · STATIC REVIEW</p>
    <h1>低饱和蓝灰管理台与中文登录界面</h1>
    <p class="intro">此静态入口用于核对重新设计后的配色、表单、按钮与响应式布局。所有文件使用 UTF-8，管理员操作不要求输入二次验证码。</p>
    <section class="cards" aria-label="Demo 页面入口">
      <article class="card"><h2>管理后台</h2><p>深蓝灰侧栏、雾白表面、可访问表单状态和直接管理员操作。</p><div class="actions"><a class="button" href="/admin.html">查看管理台与登录页</a></div></article>
      <article class="card"><h2>畅聊 Landing</h2><p>展示产品介绍、公告、安全说明与下载入口的响应式宣传首页。</p><div class="actions"><a class="button secondary" href="/home.html">查看 Landing 页面</a></div></article>
    </section>
  </main>
</body>
</html>
