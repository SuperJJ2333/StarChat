<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>平特一肖统计</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif;}
        body{background:#f0f3f8;padding:14px;}
        .wrap{max-width:860px;margin:0 auto;background:#fff;border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,0.05);overflow:hidden;}
        .header{background:#1e5ae0;color:#fff;text-align:center;padding:16px;font-size:22px;font-weight:600;letter-spacing:1px;}
        /* 上次操作记录提示框 缩小内边距省空间 */
        .last-record-box{
            margin:18px 18px 0;
            padding:10px 14px;
            background:#fefefe;
            border:1px solid #e2e8f0;
            border-radius:10px;
        }
        .record-title{
            font-size:14px;
            font-weight:600;
            color:#334155;
            margin-bottom:4px;
        }
        #recordText{
            font-size:13px;
            color:#475569;
            line-height:1.4;
            word-break:break-all;
        }
        .input-box{padding:18px 18px 16px;border-bottom:1px solid #eee;}
        .tip-text{font-size:13px;color:#64748b;margin-bottom:10px;line-height:1.4;}
        .input-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
        /* 通用输入框样式 */
        .je-inp{
            height:48px;padding:0 14px;
            border:1px solid #d2d6dc;border-radius:10px;
            font-size:16px;outline:none;transition:0.25s;
            user-select:text;
        }
        .je-inp::placeholder{
            color:#a0aec0;
        }
        .je-inp:hover{background:#f9fbff;}
        .je-inp:focus{
            border-color:#1e5ae0;
            box-shadow:0 0 0 3px rgba(30,90,224,0.12);
        }
        /* 生肖输入框 降低高度精简 */
        .sx-inp{
            flex:1;
            min-width:260px;
            height:76px;
            font-size:32px;
            text-align:center;
            user-select:none;
        }
        .sx-inp::placeholder{text-align:center;}
        /* 金额输入框 */
        .money-inp{
            width:180px;
        }
        .sub-btn{
            height:48px;padding:0 24px;background:#1e5ae0;
            color:#fff;border:none;border-radius:10px;
            font-size:16px;cursor:pointer;transition:0.2s;font-weight:500;
        }
        .sub-btn:hover{background:#1548bc;}
        .sub-btn:active{opacity:0.9;transform:scale(0.98);}
        .sub-btn:disabled{
            background:#cccccc !important;
            cursor:not-allowed;
            transform:none;
        }
        .minus-btn{
            background:#f56c6c;
        }
        .minus-btn:hover{background:#e04040;}
        .btn-area{
            margin-top:12px;
            display:flex;gap:12px;justify-content:center;flex-wrap:wrap;
        }
        .func-btn{
            padding:11px 24px;border:none;border-radius:10px;
            font-size:15px;color:#fff;cursor:pointer;transition:0.2s;font-weight:500;
        }
        .func-btn:hover{opacity:0.92;transform:translateY(-1px);}
        .func-btn:active{transform:scale(0.97);}
        .copy{background:#069470;}
        .clr-all{background:#e03131;}
        .res-table{padding:0 18px 18px;}
        table{width:100%;border-collapse:collapse;border-radius:10px;overflow:hidden;}
        th,td{border:1px solid #f1f3f9;padding:12px;font-size:15px;}
        th{background:#f0f6ff;color:#1e40af;font-weight:600;text-align:center;}
        td:nth-child(1),td:nth-child(2){text-align:center;}
        td:nth-child(3){text-align:right;}
        .empty-info{padding:40px 0;color:#94a3b8;font-size:15px;}
        .total-box{
            margin-top:14px;
            text-align:right;
            font-size:17px;
            font-weight:bold;
            color:#1e5ae0;
            padding-right:4px;
        }
        /* 选中提示文字 自动换行 */
        #selectedTip{
            font-size:14px;font-weight:500;padding:4px 8px;border-radius:6px;
            white-space:normal;
            word-break:break-all;
        }
        @media (max-width:580px){
            .input-row{justify-content:center;}
            .sx-inp{width:100%;height:64px;font-size:24px;min-width:unset;flex:none;}
            .money-inp{width:100%;}
            .sub-btn{width:100%;}
            .func-btn{width:calc(50% - 8px);}
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="header">平特一肖统计</div>

    <!-- 最近操作记录框 -->
    <div class="last-record-box">
        <div class="record-title">📝 上次操作（防止重复录入）</div>
        <div id="recordText">暂无操作记录</div>
    </div>

    <!-- 输入区域 紧凑布局 -->
    <div class="input-box">
        <div class="input-row">
            <input class="je-inp sx-inp" id="sxInput" maxlength="60" inputmode="text" placeholder="示例：鼠牛龙 马、猴 鼠鼠马" onkeyup="inputSxKeyUp(event)" oninput="filterSxInput(this)" onblur="confirmInputSx()">
            <span id="selectedTip" style="background:#f2f4f8;color:#666;">未选中生肖</span>
        </div>

        <!-- 金额输入框 -->
        <div style="margin-top:14px;">
            <div class="tip-text">仅输入1~9999999整数，操作后自动清空输入框</div>
            <div class="input-row">
                <input class="je-inp money-inp" id="changeNum" type="text" maxlength="10" inputmode="numeric" placeholder="输入金额" onkeyup="moneyKeyEnter(event)" oninput="filterMoneyInput(this)">
                <button class="sub-btn" onclick="addMoney()">批量增加金额</button>
                <button class="sub-btn minus-btn" id="minusBtn" onclick="subMoney()">批量扣除金额</button>
            </div>
        </div>

        <!-- 功能按钮 -->
        <div class="btn-area">
            <button class="func-btn copy" onclick="copyBill()">复制账单</button>
            <button class="func-btn clr-all" onclick="clearAll()">清空全部数据</button>
        </div>
    </div>

    <!-- 统计表格 -->
    <div class="res-table">
        <table>
            <thead>
                <tr>
                    <th>排名</th>
                    <th>生肖</th>
                    <th>累计金额</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="3" class="empty-info">暂无统计数据，请录入生肖金额</td></tr>
            </tbody>
        </table>
        <div class="total-box" id="totalMoney">合计总金额：0</div>
    </div>
</div>
<script>
const sxList = ["鼠","牛","虎","兔","龙","蛇","马","羊","猴","鸡","狗","猪"];
const storeKey = "sxCountData";
const recordKey = "lastOperRecord";
let billText = "";
let data = {};
let selectSxArr = [];
let minusBtnLock = false;
let moneyEnterLock = false;
let inputDebounceTimer = null;
let lastOperRecord = "暂无操作记录";

// 页面加载读取数据+上次操作记录
window.onload = function(){
    try {
        let cache = localStorage.getItem(storeKey);
        if(cache) data = JSON.parse(cache);
        // 读取留存操作记录
        let saveRecord = localStorage.getItem(recordKey);
        if(saveRecord) lastOperRecord = saveRecord;
    } catch (err) {
        console.warn("本地读取异常");
    }
    refreshSort();
    document.getElementById("recordText").innerText = lastOperRecord;
}

// 更新操作记录并持久化
function updateRecordText(text){
    lastOperRecord = text;
    document.getElementById("recordText").innerText = text;
    try{
        localStorage.setItem(recordKey, text);
    }catch(e){}
}

// 实时过滤生肖输入，只保留合法生肖汉字
function filterSxInput(dom){
    const validReg = /[^鼠牛虎兔龙蛇马羊猴鸡狗猪]/g;
    dom.value = dom.value.replace(validReg, "");
    clearTimeout(inputDebounceTimer);
    inputDebounceTimer = setTimeout(()=>confirmInputSx(), 80);
}

// 实时过滤金额输入，仅允许纯数字
function filterMoneyInput(dom){
    dom.value = dom.value.replace(/[^\d]/g, "");
}

// 生肖输入回车确认
function inputSxKeyUp(e){
    clearTimeout(inputDebounceTimer);
    inputDebounceTimer = setTimeout(()=>confirmInputSx(), 80);
    if(e.key === 'Enter') confirmInputSx();
}

// 金额输入回车节流防重复提交
function moneyKeyEnter(e){
    if(moneyEnterLock) return;
    if(e.key === 'Enter'){
        moneyEnterLock = true;
        addMoney();
        setTimeout(()=>moneyEnterLock = false,300);
    }
}

// 解析生肖，兼容粘贴换行空格
function parseMultiSx(inputStr){
    const cleanStr = inputStr.replace(/[\s\n\t]+/g, "");
    const sxReg = /[鼠牛虎兔龙蛇马羊猴鸡狗猪]/g;
    const allSxChars = cleanStr.match(sxReg) || [];
    return allSxChars;
}

// 更新选中提示
function confirmInputSx(){
    let inputVal = document.getElementById("sxInput").value;
    let tipDom = document.getElementById("selectedTip");
    selectSxArr = parseMultiSx(inputVal);
    if(selectSxArr.length > 0){
        tipDom.innerText = "✅ 当前：" + selectSxArr.join("、");
        tipDom.style.color = "#069470";
        tipDom.style.background = "#e6f8f2";
    }else{
        if(inputVal.trim() !== ""){
            tipDom.innerText = "❌ 无有效生肖";
            tipDom.style.color = "#e03131";
            tipDom.style.background = "#ffeef0";
        }else{
            tipDom.innerText = "未选中生肖";
            tipDom.style.color = "#666";
            tipDom.style.background = "#f2f4f8";
        }
    }
}

// 金额校验 1~9999999
function getValidMoney(){
    const inputVal = document.getElementById("changeNum").value.trim();
    const num = Number(inputVal);
    if(isNaN(num) || !Number.isInteger(num) || num <= 0 || num > 9999999){
        return null;
    }
    return num;
}

// 批量加款
function addMoney(){
    if(selectSxArr.length === 0){
        alert("请先输入有效生肖");
        return;
    }
    const num = getValidMoney();
    if(num === null){
        alert("请输入1~9999999正整数");
        return;
    }
    for(let sx of selectSxArr){
        data[sx] = (data[sx] || 0) + num;
    }
    try {
        localStorage.setItem(storeKey, JSON.stringify(data));
    } catch (err) {
        alert("存储失败，本次操作仅临时生效");
    }
    refreshSort();

    const record = `【加款】生肖：${selectSxArr.join("、")}｜金额：${num}`;
    updateRecordText(record);

    // 清空输入框并聚焦
    document.getElementById("changeNum").value = "";
    document.getElementById("sxInput").value = "";
    selectSxArr = [];
    const tipDom = document.getElementById("selectedTip");
    tipDom.innerText = "未选中生肖";
    tipDom.style.color = "#666";
    tipDom.style.background = "#f2f4f8";
    document.getElementById("sxInput").focus();
}

// 批量扣款
function subMoney(){
    const minusBtn = document.getElementById("minusBtn");
    if(minusBtnLock) return;
    if(selectSxArr.length === 0){
        alert("请先输入有效生肖");
        return;
    }
    const num = getValidMoney();
    if(num === null){
        alert("请输入1~9999999正整数");
        return;
    }
    let msg = `待扣：${selectSxArr.join("、")}\n单次扣 ${num}\n重复生肖多次扣除`;
    let tempData = {...data};
    let zeroList = [];
    for(let sx of selectSxArr) tempData[sx] = Math.max(0, (tempData[sx]||0) - num);
    for(let s of sxList){
        if(tempData[s] === 0 && data[s] > 0) zeroList.push(s);
    }
    if(zeroList.length) msg += `\n扣完清零：${zeroList.join("、")}`;
    if(!confirm(msg + "\n确认扣款？")) return;

    minusBtnLock = true;
    minusBtn.disabled = true;
    minusBtn.innerText = "处理中...";
    for(let sx of selectSxArr){
        data[sx] = Math.max(0, (data[sx] || 0) - num);
    }
    try {
        localStorage.setItem(storeKey, JSON.stringify(data));
    } catch (err) {
        alert("存储失败，本次操作仅临时生效");
    }
    refreshSort();

    const record = `【扣款】生肖：${selectSxArr.join("、")}｜金额：${num}`;
    updateRecordText(record);

    document.getElementById("changeNum").value = "";
    document.getElementById("sxInput").value = "";
    selectSxArr = [];
    const tipDom = document.getElementById("selectedTip");
    tipDom.innerText = "未选中生肖";
    tipDom.style.color = "#666";
    tipDom.style.background = "#f2f4f8";
    document.getElementById("sxInput").focus();

    setTimeout(()=>{
        minusBtnLock = false;
        minusBtn.disabled = false;
        minusBtn.innerText = "批量扣除金额";
    },1200);
}

// 渲染表格+优化复制账单格式
function refreshSort(){
    let arr = [];
    let total = 0;
    for(let s of sxList){
        let val = Number(data[s] || 0);
        // 脏数据强制归零
        if(isNaN(val) || val < 0) val = 0;
        data[s] = Math.floor(val);
        arr.push({name:s, money: data[s]});
        total += data[s];
    }
    arr.sort((a,b)=>b.money - a.money);
    document.getElementById("totalMoney").innerText = "合计总金额：" + total;
    let tableHtml = "";

    // 优化复制账单排版，记事本/微信粘贴对齐
    billText = "平特一肖统计账单\n";
    billText += "--------------------------------\n";
    billText += "排名  生肖  累计金额\n";
    billText += "--------------------------------\n";
    for(let i=0;i<arr.length;i++){
        const rank = String(i+1).padEnd(3, " ");
        const sxName = arr[i].name.padEnd(4, " ");
        billText += `${rank}${sxName}${arr[i].money}\n`;
        tableHtml += `<tr><td>${i+1}</td><td>${arr[i].name}</td><td>${arr[i].money}</td></tr>`;
    }
    billText += "--------------------------------\n";
    billText += `合计总金额：${total}\n`;

    document.getElementById("tableBody").innerHTML = tableHtml;
}

// 复制账单
function copyBill(){
    if(!billText){
        alert("暂无账单");
        return;
    }
    navigator.clipboard.writeText(billText)
        .then(()=>alert("复制成功"))
        .catch(()=>{
            const tempInput = document.createElement('input');
            tempInput.value = billText;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            alert("复制成功");
        });
}

// 清空全部
function clearAll(){
    if(!confirm("确定清空所有统计？无法恢复！")) return;
    data = {};
    selectSxArr = [];
    document.getElementById("sxInput").value = "";
    document.getElementById("changeNum").value = "";
    const tipDom = document.getElementById("selectedTip");
    tipDom.innerText = "未选中生肖";
    tipDom.style.color = "#666";
    tipDom.style.background = "#f2f4f8";
    // 重置操作记录并持久化
    updateRecordText("暂无操作记录");
    try {
        localStorage.removeItem(storeKey);
    } catch (e) {}
    refreshSort();
}
</script>
</body>
</html>
