plugins {
    id 'com.android.application'
}

android {
    namespace 'com.getui.demo'
    compileSdk 37

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.getui.demo"
        minSdkVersion 19
        targetSdkVersion 37
        versionCode 2
        versionName "1.1.0"

        manifestPlaceholders = [
                GETUI_APPID    : rootProject.ext.GETUI_APP_ID,
                GT_INSTALL_CHANNEL: "demo"
        ]

        buildConfigField("String", "SERVER_URL", "\"${rootProject.ext.SERVER_URL}\"")


    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            //请勿在线上版本配置MASTERSECRET的值，避免泄漏
            buildConfigField("String", "MASTERSECRET", "\"\"")
            buildConfigField("String", "APPKEY", "\"${rootProject.ext.GETUI_APP_KEY}\"")
            // Release APK must be signed; use the debug certificate until a release keystore is configured.
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
            shrinkResources false
//            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            buildConfigField("String", "APPKEY", "\"${rootProject.ext.GETUI_APP_KEY}\"")
            //请勿在线上版本配置MASTERSECRET的值，避免泄漏
            buildConfigField("String", "MASTERSECRET", "\"${rootProject.ext.MASTERSECRET}\"")

        }
    }

}

dependencies {

    implementation 'com.getui:gtc:3.3.3.0'
    implementation 'com.getui:gtsdk:3.3.15.0'
    implementation 'com.getui:gsido:1.4.14.0'

    //以下所有依赖库仅demo使用
    implementation 'androidx.appcompat:appcompat:1.6.1'
    //兼容5.0以下
    implementation 'com.squareup.okhttp3:okhttp:3.12.0'
    implementation 'com.squareup.retrofit2:retrofit:2.5.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.4.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:3.4.1'

    implementation 'io.reactivex.rxjava2:rxjava:2.2.5'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava2:2.4.0'


}
